name: Terraform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  lint-validate:
    name: Format, validate and docs check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Install helpers (tflint, terraform-docs)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl unzip jq
          # install tflint
          curl -sL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          # install terraform-docs (pinned to known working release)
          curl -sL https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz \
            | tar -xz -C /tmp && sudo install -m 0755 /tmp/terraform-docs /usr/local/bin/terraform-docs && rm -f /tmp/terraform-docs

      - name: Terraform fmt check
        run: |
          set -e
          # run fmt check in each directory that contains .tf files
          for d in $(git ls-files '*.tf' | xargs -n1 dirname | sort -u); do
            echo "Checking fmt in $d"
            (cd "$d" && terraform fmt -check -recursive)
          done

      - name: TFLint (optional)
        run: |
          set -e
          tflint --version || true

      - name: Terraform init & validate (modules)
        run: |
          set -e
          for m in modules/*; do
            if [ -d "$m" ] && ls "$m"/*.tf >/dev/null 2>&1; then
              echo "Init & validate $m"
              cd "$m"
              terraform init -backend=false
              terraform validate
              cd -
            fi
          done

      - name: Terraform init & validate (environments)
        run: |
          set -e
          for e in environments/*; do
            if [ -d "$e" ] && ls "$e"/*.tf >/dev/null 2>&1; then
              echo "Init & validate $e"
              cd "$e"
              terraform init -input=false
              terraform validate
              cd -
            fi
          done

      - name: Check terraform-docs up-to-date
        run: |
          set -e
          fail=0
          for m in modules/*; do
            if [ -d "$m" ] && ls "$m"/*.tf >/dev/null 2>&1; then
              echo "Checking docs for $m"
              pushd "$m" >/dev/null
              terraform-docs markdown table . > README.generated.md
              if ! diff -u README.md README.generated.md >/dev/null 2>&1; then
                echo "README.md out of date in $m"
                fail=1
              fi
              rm -f README.generated.md
              popd >/dev/null
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more module READMEs are out of date. Run 'terraform-docs markdown table <module> > <module>/README.md' to update them." >&2
            exit 1
          fi

  plan-prod:
    name: Terraform Plan (prod)
    runs-on: ubuntu-latest
    needs: lint-validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Init prod
        working-directory: environments/prod
        run: |
          terraform init -input=false

      - name: Plan prod
        working-directory: environments/prod
        run: |
          terraform plan -out=plan.tfplan -input=false

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-plan
          path: environments/prod/plan.tfplan
